<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Botter dashboard: the bot's panel, its settings and its log">
  <title>Botter dashboard</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <script src="/i18n.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="top">
    <h1 data-i18n="title">Botter</h1>
    <span id="conn" class="conn" role="status" aria-live="polite"></span>
    <span class="grow"></span>
    <button type="button" id="lang" class="link" data-i18n="language">English</button>
    <button type="button" id="logout" data-i18n="logout">Sign out</button>
  </header>

  <main class="layout">
    <div class="column">
      <section class="card" aria-labelledby="panel-heading">
        <h2 id="panel-heading" data-i18n="panel">Panel</h2>
        <p id="panel-empty" class="muted" data-i18n="panelNone"></p>
        <div id="panel"></div>
      </section>

      <section class="card" aria-labelledby="signin-heading">
        <h2 id="signin-heading" data-i18n="signinHeading">Add an e-mail account</h2>
        <form id="signin" class="stack">
          <label for="signin-email" data-i18n="email">E-mail</label>
          <input id="signin-email" type="email" autocomplete="off" required>
          <label for="signin-password" data-i18n="password">Password</label>
          <input id="signin-password" type="password" autocomplete="off" required>
          <p class="muted" data-i18n="signinNote"></p>
          <button type="submit" data-i18n="signin">Sign in</button>
          <p id="signin-result" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="card activity-card" aria-labelledby="activity-heading">
        <h2 id="activity-heading" data-i18n="activity">Activity</h2>
        <p id="activity-empty" class="muted" data-i18n="activityEmpty"></p>
        <ol id="activity" class="activity"></ol>
      </section>
    </div>

    <section class="card settings-card" aria-labelledby="settings-heading">
      <h2 id="settings-heading" data-i18n="settings">Settings</h2>
      <iframe id="settings" class="settings" data-i18n-title="settings" title="Settings"></iframe>
    </section>
  </main>
</body>
</html>
